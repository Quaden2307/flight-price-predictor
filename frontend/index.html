<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Type a route and a date to see the typical round-trip fare, and whether the price you found beats it.">
<meta name="theme-color" content="#a9c2cc">
<title>Fare checker</title>
<link rel="preconnect" href="https://api.fontshare.com">
<link rel="preconnect" href="https://cdn.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=gambarino@400&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500&display=swap" rel="stylesheet">
<script>document.documentElement.classList.add("js")</script>
<style>
  /* One screen: a small plane drifts through paper-cut clouds, and a bone-paper ticket sits centred
     in the sky. Two-colour print: olive ink on bone, set against a dusty sky. */
  :root {
    --sky: #a9c2cc;
    --sun: #c2d4db;
    --cloud-far: #bccfd7;
    --cloud-mid: #dce6e8;
    --cloud-mid-shade: #c6d6db;
    --cloud: #f4f6f6;
    --cloud-shade: #d9e3e6;
    --paper: #ecebe7;
    --field: #e0ded8;
    --field-hover: #d7d5ce;
    --plane-shade: #d6d4cd;
    --ink: #38450f;
    --muted: #5d683a;
    --on-ink: #ecebe7;
    --good: #38450f;
    --typical: #3f5a66;
    --high: #8a2f22;

    --font-display: "Gambarino", "Iowan Old Style", Georgia, serif;
    --font-text: "General Sans", "Helvetica Neue", Arial, sans-serif;
    --step-small: 0.875rem;
    --step-body: 1rem;
    --step-code: clamp(2.5rem, 1.7rem + 2.2vw, 3.75rem);
    --step-price: clamp(2.25rem, 1.6rem + 1.8vw, 3.25rem);

    --margin: clamp(16px, 2vw, 28px);
    --radius: 18px;
    --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    --ease-in-out: cubic-bezier(0.45, 0, 0.55, 1);
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    background: var(--sky);
    color: var(--ink);
    font-family: var(--font-text);
    font-size: var(--step-body);
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  h1, p { margin: 0; }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--focus, var(--ink)); outline-offset: 3px; }
  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }

  /* ---------- the sky ---------- */
  .sky { position: fixed; inset: 0; overflow: hidden; pointer-events: none; }
  .sun {
    position: absolute;
    top: 9%;
    right: 14%;
    width: clamp(90px, 11vw, 160px);
    aspect-ratio: 1;
    border-radius: 50%;
    background: var(--sun);
  }
  .clouds { position: absolute; left: 0; width: 100%; overflow: hidden; }
  .clouds .strip { display: flex; width: max-content; animation: drift var(--speed, 90s) linear infinite; }
  .clouds svg { display: block; flex: none; }
  .clouds.far { top: 4%; }
  .clouds.mid { top: 22%; }
  .clouds.front { top: 8%; z-index: 3; }
  .clouds.floor-back { bottom: -30px; z-index: 4; }
  .clouds.floor { bottom: -50px; z-index: 5; }
  @keyframes drift { to { transform: translateX(calc(var(--tile) * -1px)); } }

  /* the plane holds its place while the clouds stream past; it rides small bumps of air */
  .flight {
    position: absolute;
    z-index: 2;
    left: 50%;
    top: 15%;
    width: clamp(150px, 17vw, 270px);
    translate: -50% 0;
  }
  .plane { display: block; width: 100%; height: auto; overflow: visible; animation: bob 7s var(--ease-in-out) infinite; transform-origin: 60% 50%; }
  .beacon { animation: blink 1.6s steps(1) infinite; }
  .puff {
    position: absolute;
    top: 46%;
    left: 4%;
    width: 9%;
    aspect-ratio: 1;
    border-radius: 50%;
    background: var(--cloud);
    opacity: 0;
    animation: puff 2.4s linear infinite;
  }
  .puff:nth-child(2) { animation-delay: -0.8s; }
  .puff:nth-child(3) { animation-delay: -1.6s; }
  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    30% { transform: translateY(-7px) rotate(-1.2deg); }
    65% { transform: translateY(5px) rotate(0.8deg); }
  }
  @keyframes blink { 0%, 70% { opacity: 1; } 71%, 100% { opacity: 0.15; } }
  @keyframes puff {
    0% { opacity: 0.9; transform: translateX(0) scale(0.5); }
    100% { opacity: 0; transform: translateX(-260%) scale(1.5); }
  }

  /* ---------- the screen: one ticket, centred ---------- */
  .screen {
    position: relative;
    z-index: 6;
    height: 100%;
    display: grid;
    place-items: center;
    padding:
      max(var(--margin), env(safe-area-inset-top, 0px))
      max(var(--margin), env(safe-area-inset-right, 0px))
      max(var(--margin), env(safe-area-inset-bottom, 0px))
      max(var(--margin), env(safe-area-inset-left, 0px));
  }

  .ticket {
    --stub-bg: var(--paper);
    --stub-ink: var(--ink);
    --cut-x: 68%;
    --cut-y: 62%;
    /* two notches where the stub tears off, cut with hard-edged circles in a mask */
    --notches:
      radial-gradient(circle at var(--cut-x) 0, #0000 13px, #000 13.5px) top / 100% 51% no-repeat,     /* taste-skill-ignore */
      radial-gradient(circle at var(--cut-x) 100%, #0000 13px, #000 13.5px) bottom / 100% 51% no-repeat; /* taste-skill-ignore */
    position: relative;
    width: min(100%, 50rem);
    display: grid;
    grid-template-columns: minmax(0, 1fr) 13rem;
    border-radius: var(--radius);
    background: var(--paper);
    color: var(--ink);
    -webkit-mask: var(--notches);
    mask: var(--notches);
    margin-top: 6vh;
  }
  .ticket[data-verdict="good"] { --stub-bg: var(--good); --stub-ink: var(--on-ink); }
  .ticket[data-verdict="typical"] { --stub-bg: var(--typical); --stub-ink: var(--on-ink); }
  .ticket[data-verdict="high"] { --stub-bg: var(--high); --stub-ink: var(--on-ink); }

  .ticket__main { display: grid; gap: 22px; padding: clamp(22px, 2.6vw, 34px); min-width: 0; }
  .route { display: flex; align-items: center; gap: 14px; min-height: calc(var(--step-code) * 1.25); }
  .route input {
    width: 2.8em;
    padding: 0 0.05em 0.08em;
    border: 0;
    border-bottom: 2px solid color-mix(in srgb, var(--ink) 28%, transparent);
    border-radius: 0;
    background: transparent;
    color: var(--ink);
    font-family: var(--font-display);
    font-size: var(--step-code);
    font-weight: 400;
    letter-spacing: 0.01em;
    line-height: 1.05;
    text-transform: uppercase;
    transition: border-color 180ms ease;
  }
  @supports (field-sizing: content) {
    .route input { field-sizing: content; width: auto; min-width: 1.6em; }
  }
  .route input::-webkit-calendar-picker-indicator { display: none !important; }
  .route input::placeholder { color: color-mix(in srgb, var(--ink) 40%, transparent); }
  .route input:hover, .route input:focus { border-bottom-color: var(--ink); }
  .route input:focus-visible { outline: none; }
  /* a name being typed reads as text, not as a giant code */
  .route input.is-text {
    min-width: 9em;
    padding-bottom: 0.3em;
    font-family: var(--font-text);
    font-size: 1.125rem;
    letter-spacing: 0;
    text-transform: none;
  }

  /* ---------- airport suggestions ---------- */
  .suggest {
    position: fixed;
    z-index: 30;
    margin: 0;
    padding: 6px;
    list-style: none;
    overflow-y: auto;
    border-radius: 16px;
    background: var(--paper);
    color: var(--ink);
    box-shadow: 0 16px 40px rgba(37, 52, 60, 0.22); /* taste-skill-ignore: a menu really floats */
  }
  .suggest li { display: flex; align-items: center; gap: 14px; padding: 9px 12px; border-radius: 11px; cursor: pointer; }
  .suggest li[aria-selected="true"] { background: var(--field); }
  .suggest__code { flex: none; width: 2.4em; font-family: var(--font-display); font-size: 1.375rem; line-height: 1; }
  .suggest__text { display: grid; min-width: 0; }
  .suggest__name, .suggest__place { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .suggest__name { font-size: 0.9375rem; font-weight: 500; }
  .suggest__place { font-size: var(--step-small); color: var(--muted); }
  .suggest .suggest__empty { padding: 12px; cursor: default; color: var(--muted); font-size: 0.9375rem; }
  .swap {
    flex: none;
    display: grid;
    place-items: center;
    width: 42px;
    height: 42px;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: var(--field);
    color: var(--ink);
    cursor: pointer;
    transition: background-color 180ms ease, transform 160ms var(--ease-out);
  }
  .swap:hover { background: var(--field-hover); }
  .swap:active { transform: scale(0.94); }
  .swap svg { width: 18px; height: 18px; transition: rotate 300ms var(--ease-out); }
  .swap.is-swapped svg { rotate: 180deg; }

  .fields { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; gap: 10px; }
  .fields input {
    min-width: 0;
    min-height: 46px;
    padding: 0 18px;
    border: 0;
    border-radius: 999px;
    background: var(--field);
    color: var(--ink);
    color-scheme: light;
    transition: background-color 180ms ease;
  }
  .fields input:hover { background: var(--field-hover); }
  .fields input::placeholder { color: var(--muted); }
  .go {
    min-height: 46px;
    padding: 0 1.5em;
    border: 0;
    border-radius: 999px;
    background: var(--ink);
    color: var(--on-ink);
    font-weight: 500;
    cursor: pointer;
    transition: background-color 180ms ease, transform 160ms var(--ease-out);
  }
  .go:hover { background: #4a5a17; }
  .go:active { transform: scale(0.97); }

  /* the stub: a row of punched holes, then the answer */
  .stub {
    --focus: var(--stub-ink);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 6px;
    padding: 24px 18px;
    border-left: 4px dotted var(--sky);
    background: var(--stub-bg);
    color: var(--stub-ink);
    text-align: center;
    min-width: 0;
    transition: background-color 500ms var(--ease-out), color 500ms var(--ease-out);
  }
  .stub__label { font-size: var(--step-small); font-weight: 500; line-height: 1.35; max-width: 16ch; }
  .stub__price { font-family: var(--font-display); font-size: var(--step-price); line-height: 1.05; font-variant-numeric: tabular-nums; }
  .stub__range { font-size: var(--step-small); font-variant-numeric: tabular-nums; opacity: 0.85; }
  .stub.is-stale .stub__price, .stub.is-stale .stub__range { opacity: 0.35; }

  /* ---------- phone: the ticket stands upright, the stub tears off the bottom ---------- */
  @media (max-width: 40rem) {
    .flight { top: 9%; width: 150px; }
    .clouds.front { top: 4%; }
    .ticket {
      --notches:
        radial-gradient(circle at 0 var(--cut-y), #0000 13px, #000 13.5px) left / 51% 100% no-repeat,     /* taste-skill-ignore */
        radial-gradient(circle at 100% var(--cut-y), #0000 13px, #000 13.5px) right / 51% 100% no-repeat; /* taste-skill-ignore */
      grid-template-columns: minmax(0, 1fr);
      margin-top: 14vh;
    }
    .ticket__main { gap: 18px; padding: 22px 20px; }
    .route { justify-content: space-between; }
    .route input.is-text { min-width: 7em; }
    .fields { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
    .go { grid-column: 1 / -1; }
    .stub { border-left: 0; border-top: 4px dotted var(--sky); padding: 18px 20px 22px; }
    .stub__label { max-width: none; }
  }
  @media (max-height: 30rem) {
    body { overflow: auto; }
    .screen { height: auto; min-height: 100%; }
  }

  /* ---------- motion: everything drifts slowly; nothing moves for people who ask it not to ---------- */
  @media (prefers-reduced-motion: no-preference) {
    .js .ticket { animation: settle 900ms var(--ease-out) 200ms both; }
  }
  @keyframes settle { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    .clouds .strip, .plane, .beacon, .puff { animation: none; }
    .swap svg { transition: none; }
  }
</style>
</head>
<body>

<div class="sky" aria-hidden="true">
  <div class="sun"></div>
  <div class="clouds far" data-tile="1500" data-h="300" data-n="5" data-w="140,260" data-base="0.45,0.95" data-tone="--cloud-far" data-seed="7" style="--speed:170s"></div>
  <div class="clouds mid" data-tile="1700" data-h="300" data-n="4" data-w="220,360" data-base="0.5,0.92" data-tone="--cloud-mid" data-shade="--cloud-mid-shade" data-seed="21" style="--speed:100s"></div>
  <div class="flight">
    <span class="puff"></span><span class="puff"></span><span class="puff"></span>
    <svg class="plane" viewBox="0 0 240 110">
      <path d="M156 44 L132 19 Q129 16 125 17 L121 19 L136 44 Z" fill="var(--plane-shade)"/>
      <path d="M84 44 L48 12 Q46 10 43 10 L36 10 Q32 10 33 14 L44 44 Z" fill="var(--ink)"/>
      <path d="M34 56 C34 47 44 42 62 42 L186 42 C210 42 226 49 231 57 C226 65 210 70 186 70 L62 70 C44 70 34 64 34 56 Z" fill="var(--paper)"/>
      <path d="M35 60 C38 66 47 70 62 70 L186 70 C206 70 221 66 228 61 Z" fill="var(--plane-shade)"/>
      <path d="M48 55 L222 55" stroke="var(--ink)" stroke-width="2.4" stroke-linecap="round"/>
      <g fill="var(--ink)">
        <circle cx="84" cy="49" r="2.3"/><circle cx="94" cy="49" r="2.3"/><circle cx="104" cy="49" r="2.3"/>
        <circle cx="114" cy="49" r="2.3"/><circle cx="124" cy="49" r="2.3"/><circle cx="134" cy="49" r="2.3"/>
        <circle cx="144" cy="49" r="2.3"/><circle cx="154" cy="49" r="2.3"/><circle cx="164" cy="49" r="2.3"/>
        <circle cx="174" cy="49" r="2.3"/><circle cx="184" cy="49" r="2.3"/>
      </g>
      <path d="M205 47 Q216 46 223 51 L208 51 Q204 51 205 47 Z" fill="var(--ink)"/>
      <path d="M62 60 L38 72 Q35 74 32 72 L32 70 L48 60 Z" fill="var(--plane-shade)"/>
      <path d="M152 62 L116 92 Q113 95 108 94 L104 92 L122 62 Z" fill="#e6e4de"/>
      <rect x="126" y="70" width="34" height="13" rx="6.5" fill="var(--plane-shade)"/>
      <rect x="155" y="71" width="6" height="11" rx="3" fill="var(--ink)"/>
      <circle class="beacon" cx="36" cy="10" r="2.6" fill="#b5442f"/>
    </svg>
  </div>
  <div class="clouds front" data-tile="2300" data-h="240" data-n="2" data-w="260,380" data-base="0.62,0.9" data-tone="--cloud" data-shade="--cloud-shade" data-seed="3" style="--speed:40s"></div>
  <div class="clouds floor-back" data-tile="1600" data-h="260" data-n="7" data-w="260,440" data-base="1.0,1.12" data-tone="--cloud-mid" data-shade="--cloud-mid-shade" data-seed="11" data-fill="0.82" style="--speed:130s"></div>
  <div class="clouds floor" data-tile="1800" data-h="220" data-n="7" data-w="280,460" data-base="1.05,1.18" data-tone="--cloud" data-shade="--cloud-shade" data-seed="5" data-fill="0.86" style="--speed:75s"></div>
</div>

<main class="screen">
  <h1 class="visually-hidden">Fare checker</h1>

  <section class="ticket" id="pass" data-verdict="none" aria-label="Check a fare" data-ui>
    <form class="ticket__main" id="routeForm" novalidate>
      <div class="route">
        <input id="from" value="JFK" placeholder="From" autocomplete="off" spellcheck="false" role="combobox" aria-autocomplete="list" aria-haspopup="listbox" aria-expanded="false" aria-controls="suggest" aria-label="From: airport code, airport name or city">
        <button class="swap" type="button" id="swapBtn" aria-label="Swap origin and destination">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h15M15 4l4 4-4 4M20 16H5M9 12l-4 4 4 4"/></svg>
        </button>
        <input id="to" value="NRT" placeholder="To" autocomplete="off" spellcheck="false" role="combobox" aria-autocomplete="list" aria-haspopup="listbox" aria-expanded="false" aria-controls="suggest" aria-label="To: airport code, airport name or city">
      </div>
      <div class="fields">
        <input type="date" id="dep" aria-label="Departure date">
        <input type="text" id="quoted" inputmode="numeric" placeholder="Price you found" autocomplete="off" aria-label="Price you found (optional)">
        <button class="go" type="submit">Check fare</button>
      </div>
    </form>

    <div class="stub" id="result">
      <p class="stub__label" id="label">Typical fare</p>
      <p class="stub__price" id="price" aria-hidden="true"></p>
      <p class="stub__range"><span id="lo"></span> to <span id="hi"></span></p>
      <p class="visually-hidden" id="status" role="status"></p>
    </div>
  </section>

  <ul class="suggest" id="suggest" role="listbox" aria-label="Airports" hidden></ul>
</main>

<script>
  // =====================================================================
  // The sky: paper-cut clouds, drawn once per layer and tiled so the drift loops seamlessly
  // =====================================================================
  (() => {
    const css = getComputedStyle(document.documentElement);
    const colour = (name) => (name ? css.getPropertyValue(name).trim() : "");
    // a flat-bottomed cumulus: bumps of different sizes sitting on one baseline, over a rounded base
    const cloud = (cx, by, w, rnd) => {
      const bumps = [[-0.32, 0.13], [-0.14, 0.19 + rnd() * 0.04], [0.06, 0.24 + rnd() * 0.05], [0.27, 0.16 + rnd() * 0.03], [0.4, 0.1]];
      const base = w * 0.12;
      let s = `<rect x="${cx - w / 2}" y="${by - base}" width="${w}" height="${base}" rx="${base / 2}"/>`;
      for (const [dx, r] of bumps) s += `<circle cx="${cx + dx * w}" cy="${by - r * w}" r="${r * w}"/>`;
      return s;
    };
    for (const layer of document.querySelectorAll(".clouds")) {
      const d = layer.dataset;
      const tile = +d.tile, h = +d.h, n = +d.n;
      const [wMin, wMax] = d.w.split(",").map(Number);
      const [bMin, bMax] = d.base.split(",").map(Number);
      const generator = (s) => () => (s = (s * 16807) % 2147483647) / 2147483647;
      let seed = +d.seed;
      const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
      let body = "", shade = "";
      for (let i = 0; i < n; i++) {
        const w = wMin + rnd() * (wMax - wMin);
        const cx = ((i + 0.15 + rnd() * 0.7) / n) * tile;
        // the tallest bump rises about 0.6 × width above the baseline; keep it inside the strip
        const by = Math.max(h * (bMin + rnd() * (bMax - bMin)), w * 0.6 + 6);
        const shape = seed;
        rnd(); rnd();
        // a cloud that crosses a tile edge is drawn again one tile over, so the loop has no seam
        const shifts = [0];
        if (cx - w / 2 < 0) shifts.push(tile);
        if (cx + w / 2 > tile) shifts.push(-tile);
        for (const shift of shifts) {
          body += cloud(cx + shift, by, w, generator(shape));
          shade += cloud(cx + shift, by + w * 0.05, w, generator(shape));
        }
      }
      const fill = d.fill ? `<rect x="0" y="${h * +d.fill}" width="${tile}" height="${h}"/>` : "";
      const svg = `<svg width="${tile}" height="${h}" viewBox="0 0 ${tile} ${h}">` +
        (d.shade ? `<g fill="${colour(d.shade)}">${shade}${fill}</g>` : "") +
        `<g fill="${colour(d.tone)}">${body}${fill}</g></svg>`;
      layer.style.height = h + "px";
      layer.style.setProperty("--tile", tile);
      layer.innerHTML = `<div class="strip">${svg}${svg}${svg}</div>`;
    }
  })();

  // =====================================================================
  // Data from the trained model bundle (models/)
  // =====================================================================
  // ---- REAL data from the trained model bundle (models/) ----
  // ROUTE_MEANS: all 357 routes the model trained on, keyed by IATA
  // CITY code pair; value = typical round-trip price in dollars.
  // AIRPORT_TO_CITY: fares are priced by metro area — JFK and EWR both map
  // to NYC, the same route to the model. Codes not listed map to themselves.
  const AIRPORT_TO_CITY = {
    "AZA":"PHX","BFI":"SEA","BUR":"LAX","CDG":"PAR","CLD":"SAN","DAL":"DFW","DCA":"WAS","DMK":"BKK",
    "DTW":"DTT","EOH":"MDE","EWR":"NYC","EZE":"BUE","FCO":"ROM","GRU":"SAO","HHN":"FRA","HND":"TYO",
    "IAD":"WAS","IAH":"HOU","ICN":"SEL","JFK":"NYC","LGA":"NYC","LHR":"LON","MCO":"ORL","NLU":"MEX",
    "NRT":"TYO","ORD":"CHI","PEK":"BJS","PVG":"SHA","SAW":"IST","SNA":"LAX","TLC":"MEX","TSA":"TPE",
    "XNB":"DXB","YEG":"YEA","YUL":"YMQ","YYZ":"YTO","ZMU":"MUC","ZYA":"AMS"
  };
  const ROUTE_MEANS = {
    "ATL-BOS":230,"ATL-CHI":200,"ATL-CLT":292,"ATL-DFW":164,"ATL-FLL":157,"ATL-LAX":284,
    "ATL-LON":911,"ATL-MIA":158,"ATL-ONT":322,"ATL-ORL":143,"ATL-RDU":154,"ATL-TPA":111,
    "AUS-DFW":349,"BOS-AMS":772,"BOS-BCN":686,"BOS-DUB":632,"BOS-LON":797,"BOS-PAR":767,

    ["YHZ", "Halifax Stanfield International", "CA", "Halifax"],["YMQ", "", "CA", "Montreal"],["YOW", "Ottawa Macdonald–Cartier International", "CA", "Ottawa"],
    ["YTO", "", "CA", "Toronto"],["YUL", "Montréal–Trudeau International", "CA", "Montréal"],["YVR", "Vancouver International", "CA", "Vancouver"],
    ["YYC", "Calgary International", "CA", "Calgary"],["YYZ", "Toronto Pearson International", "CA", "Toronto"],["ZRH", "Zürich Airport", "CH", "Zurich"]
  ];
  const COUNTRIES = {
    AE: "United Arab Emirates", AR: "Argentina", AW: "Aruba", BR: "Brazil", CA: "Canada", CH: "Switzerland",
    CL: "Chile", CN: "China", CO: "Colombia", DE: "Germany", DO: "Dominican Republic", ES: "Spain", FR: "France",
    GB: "United Kingdom", HK: "Hong Kong", IE: "Ireland", IN: "India", IT: "Italy", JM: "Jamaica", JP: "Japan",
    KR: "South Korea", MX: "Mexico", NL: "Netherlands", PE: "Peru", PH: "Philippines", PR: "Puerto Rico",
    PT: "Portugal", QA: "Qatar", SG: "Singapore", TH: "Thailand", TR: "Türkiye", TW: "Taiwan", US: "United States"
  };
  const ALSO_KNOWN_AS = { AE: "UAE", GB: "UK England", KR: "Korea", TR: "Turkey", US: "USA" };
  // lower case, accents and apostrophes dropped, everything else a space: "O'Hare" → "ohare", "Montréal" → "montreal"
  const norm = (s) => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/['’.]/g, "").replace(/[^a-z0-9]+/g, " ").trim();
  // how many of the model's routes touch a city: busier cities win ties ("san" → SFO before Santo Domingo)
  const ROUTES_PER_CITY = {};
  for (const key of Object.keys(ROUTE_MEANS)) for (const c of key.split("-")) ROUTES_PER_CITY[c] = (ROUTES_PER_CITY[c] || 0) + 1;
  const PLACES = AIRPORTS.map(([code, name, cc, extra]) => {
    const city = nameOf(cityOf(code));
    const metro = !name;
    const hay = norm([code, name, city, extra, COUNTRIES[cc], ALSO_KNOWN_AS[cc] || ""].join(" "));
    return {
      code, metro,
      title: metro ? `${city}, all airports` : name,
      place: metro ? COUNTRIES[cc] : `${city}, ${COUNTRIES[cc]}`,
      words: hay.split(" "), squash: hay.replace(/ /g, ""), city: norm(city),
      busy: ROUTES_PER_CITY[cityOf(code)] || 0,
    };
  });
  function searchAirports(query) {
    const q = norm(query);
    if (!q) return [];
    const tokens = q.split(" ");
    const hits = [];
    for (const p of PLACES) {
      const code = p.code.toLowerCase();
      let score = q === code ? 1000 : tokens.length === 1 && code.startsWith(q) ? 400 : 0;
      // every word typed has to start a word of the airport, its city or country, or sit inside one
      let matched = true, words = 0;
      for (const t of tokens) {
        if (p.words.some((w) => w.startsWith(t))) words += 40;
        else if (p.squash.includes(t)) words += 10;
        else { matched = false; break; }
      }
      if (matched) score += words + (p.city.startsWith(tokens[0]) ? 15 : 0);
      else if (!score && p.squash.includes(q.replace(/ /g, ""))) score = 5;
      if (!score) continue;
      if (p.metro && p.city.startsWith(q)) score += 25;   // "toronto" puts the whole city first
      hits.push({ p, score });
    }
    hits.sort((a, b) => b.score - a.score || b.p.busy - a.p.busy || b.p.metro - a.p.metro || a.p.title.localeCompare(b.p.title));
    return hits.slice(0, 7).map((h) => h.p);
  }
  const looksLikeCode = (v) => /^[A-Za-z]{0,3}$/.test(v.trim());
  // what a field means: an exact code wins, otherwise the best match for the words typed
  function resolveCode(value) {
    const v = value.trim();
    if (!v) return null;
    if (looksLikeCode(v) && KNOWN_CODES.has(v.toUpperCase())) return v.toUpperCase();
    const best = searchAirports(v)[0];
    return best ? best.code : null;
  }

  // =====================================================================
  // The checker (sample predictions until the prediction API is wired)
  // =====================================================================
  const ticket = $("pass"), form = $("routeForm"), result = $("result"), label = $("label"), priceEl = $("price");
  const fromIn = $("from"), toIn = $("to"), depIn = $("dep"), quotedIn = $("quoted");

  // the notches sit exactly on the stub's line of punched holes, wherever the layout puts it
  const placeNotches = () => {
    ticket.style.setProperty("--cut-x", result.offsetLeft + 2 + "px");
    ticket.style.setProperty("--cut-y", result.offsetTop + 2 + "px");
  };
  if ("ResizeObserver" in window) new ResizeObserver(placeNotches).observe(ticket);
  placeNotches();

  const localISO = (d) => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  const today = new Date();
  depIn.min = localISO(today);
  const defaultDep = new Date(today);
  defaultDep.setDate(defaultDep.getDate() + 45);
  depIn.value = localISO(defaultDep);

  // deterministic tiny wiggle so different dates feel alive (±4%)
  function dateWiggle(dateStr) {
    let h = 0;
    for (const ch of dateStr) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
    return 1 + ((h % 81) - 40) / 1000;
  }

  const list = $("suggest");
  let owner = null, options = [], index = -1;
  const fitText = (input) => input.classList.toggle("is-text", !looksLikeCode(input.value));
  function placeList() {
    const r = owner.getBoundingClientRect();
    const width = Math.min(380, innerWidth - 32);
    list.style.width = width + "px";
    list.style.left = Math.max(16, Math.min(r.left, innerWidth - width - 16)) + "px";
    list.style.top = r.bottom + 10 + "px";
    list.style.maxHeight = Math.max(160, innerHeight - r.bottom - 26) + "px";
  }
  function highlight(i) {
    index = i;
    [...list.children].forEach((li, j) => li.setAttribute("aria-selected", String(j === i)));
    if (i >= 0 && list.children[i]) {
      owner.setAttribute("aria-activedescendant", list.children[i].id);
      list.children[i].scrollIntoView({ block: "nearest" });
    } else owner.removeAttribute("aria-activedescendant");
  }
  function openList(input) {
    const query = input.value.trim();
    if (!query) return closeList();
    owner = input;
    options = searchAirports(query);
    list.textContent = "";
    if (!options.length) {
      const li = document.createElement("li");
      li.className = "suggest__empty";
      li.textContent = `No airport we cover matches “${query}”.`;
      list.appendChild(li);
    }
    options.forEach((p, i) => {
      const li = document.createElement("li");
      li.id = "airport-" + p.code;
      li.setAttribute("role", "option");
      li.innerHTML = '<span class="suggest__code"></span><span class="suggest__text"><span class="suggest__name"></span><span class="suggest__place"></span></span>';
      li.querySelector(".suggest__code").textContent = p.code;
      li.querySelector(".suggest__name").textContent = p.title;
      li.querySelector(".suggest__place").textContent = p.place;
      li.addEventListener("mousedown", (e) => { e.preventDefault(); choose(i); });
      li.addEventListener("mousemove", () => { if (index !== i) highlight(i); });
      list.appendChild(li);
    });
    list.hidden = false;
    input.setAttribute("aria-expanded", "true");
    placeList();
    highlight(options.length ? 0 : -1);
  }
  function closeList() {
    list.hidden = true;
    if (owner) { owner.setAttribute("aria-expanded", "false"); owner.removeAttribute("aria-activedescendant"); }
    options = [];
    index = -1;
  }
  function choose(i) {
    const p = options[i];
    if (!p || !owner) return;
    owner.value = p.code;
    fitText(owner);
    closeList();
  }
  for (const input of [fromIn, toIn]) {
    input.addEventListener("focus", () => input.select());
    input.addEventListener("input", () => { fitText(input); openList(input); });
    input.addEventListener("keydown", (e) => {
      const open = !list.hidden && owner === input;
      if (e.key === "ArrowDown") {
        e.preventDefault();
        if (!open) openList(input);
        else if (options.length) highlight((index + 1) % options.length);
      } else if (e.key === "ArrowUp" && open && options.length) {
        e.preventDefault();
        highlight((index - 1 + options.length) % options.length);
      } else if (e.key === "Enter" && open && index >= 0) {
        e.preventDefault();
        choose(index);
      } else if (e.key === "Escape" && open) {
        e.preventDefault();
        closeList();
      } else if (e.key === "Tab" && open && index >= 0) {
        choose(index);
      }
    });
    // leaving a field settles it on its best match, so "toronto pearson" becomes YYZ
    input.addEventListener("blur", () => {
      const code = resolveCode(input.value);
      if (code) input.value = code;
      fitText(input);
      if (owner === input) closeList();
    });
  }
  addEventListener("resize", () => { if (!list.hidden) placeList(); });

  $("swapBtn").addEventListener("click", () => {
    [fromIn.value, toIn.value] = [toIn.value, fromIn.value];
    fitText(fromIn);
    fitText(toIn);
    $("swapBtn").classList.toggle("is-swapped");
  });

  function fail(msg) {
    ticket.dataset.verdict = "none";
    label.textContent = msg;
    $("status").textContent = msg;
    result.classList.add("is-stale");
  }

  function check(animate) {
    closeList();
    const from = resolveCode(fromIn.value), to = resolveCode(toIn.value);
    if (!from || !to) return fail(`We couldn’t find “${(from ? toIn : fromIn).value.trim() || "—"}”.`);
    fromIn.value = from;
    toIn.value = to;
    fitText(fromIn);
    fitText(toIn);
    const dep = depIn.value;
    const quotedRaw = quotedIn.value.replace(/[$,\s]/g, "");
    const quoted = quotedRaw ? Number(quotedRaw) : null;

    // same translation step as the real serving path: fares are priced per metro area
    const cf = cityOf(from), ct = cityOf(to);
    if (cf === ct) return fail("Pick two different cities.");
    if (!dep || dep < depIn.min) return fail("Pick a future date.");
    if (quotedRaw && (!Number.isFinite(quoted) || quoted <= 0)) return fail("Enter your price as a number.");

    const key = cf + "-" + ct;
    const seen = key in ROUTE_MEANS;
    const km = distanceKm(cf, ct);
    // unseen route: fall back to the distance curve, then to the global typical fare
    const base = seen ? ROUTE_MEANS[key] : (km ? curve(km) : COLD_START);
    const pred = base * dateWiggle(dep + key);
    const err = seen ? MAPE_KNOWN : MAPE_UNSEEN;
    render({ pred, lo: pred * (1 - err), hi: pred * (1 + err), err, quoted }, animate);
  }

  form.addEventListener("submit", (ev) => {
    ev.preventDefault();
    check(true);
  });

  // the figure rolls gently from the last value to the new one
  let shown = 0, frame = 0;
  function rollPrice(to, animate) {
    cancelAnimationFrame(frame);
    if (!animate || reduced) { shown = to; priceEl.textContent = money(to); return; }
    const from = shown, start = performance.now(), dur = 900;
    const step = (now) => {
      const t = Math.min(1, (now - start) / dur), e = 1 - Math.pow(1 - t, 3);
      shown = from + (to - from) * e;
      priceEl.textContent = money(shown);
      if (t < 1) frame = requestAnimationFrame(step);
    };
    frame = requestAnimationFrame(step);
  }

  function render(r, animate) {
    result.classList.remove("is-stale");
    rollPrice(r.pred, animate);
    $("lo").textContent = money(r.lo);
    $("hi").textContent = money(r.hi);

    let verdict = "none", text = "Typical fare";
    if (r.quoted != null) {
      const gap = (r.quoted - r.pred) / r.pred;
      const z = gap / r.err;
      const by = Math.abs(Math.round(gap * 100)) + "%";
      if (z <= -1) { verdict = "good"; text = `Good fare, ${by} under typical`; }
      else if (z >= 1) { verdict = "high"; text = `High fare, ${by} over typical`; }
      else { verdict = "typical"; text = "About typical"; }
    }
    ticket.dataset.verdict = verdict;
    label.textContent = text;
    $("status").textContent = `${text}: ${money(r.pred)}, usually ${money(r.lo)} to ${money(r.hi)}.`;
  }

  check(!reduced);
</script>
</body>
</html>
